name: Deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Check release configuration
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          set -euo pipefail
          : "${RELEASE_REPOSITORY:?Release repository is not configured}"
          : "${STATIC_SITE_RELEASE_WORKFLOW:?Release workflow is not configured}"

      - name: Mint release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}
          permission-actions: write

      - name: Dispatch verified source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          set -euo pipefail
          if [ "${#SOURCE_SHA}" -ne 40 ]; then exit 1; fi
          case "$SOURCE_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          gh workflow run "$STATIC_SITE_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" --ref main \
            -f site=foundry -f sha="$SOURCE_SHA" -f require_latest=true
