<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundry — Shader Effects Editor</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <meta name="description" content="Free shader effects editor. Real-time shader editing with WebGL2/WebGPU.">
    <meta name="keywords" content="GPU, GLSL, WebGPU, shader, effects, hot-reload, DSL">
    <!-- OpenGraph -->
    <meta property="og:title" content="Foundry — Shader Effects Editor">
    <meta property="og:description" content="Free shader code editor with hot-reloading. Write WebGL2 and WebGPU effects and see them render immediately.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://foundry.noisedeck.app/">
    <meta property="og:image" content="https://foundry.noisedeck.app/img/og-image.png">
    <meta property="og:site_name" content="Noise Factor">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Foundry — Shader Effects Editor">
    <meta name="twitter:description" content="Free shader code editor with hot-reloading. Write WebGL2 and WebGPU effects and see them render immediately.">
    <meta name="twitter:image" content="https://foundry.noisedeck.app/img/og-image.png">
    <link rel="canonical" href="https://foundry.noisedeck.app/">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Foundry",
        "description": "Free shader effects editor with hot-reloading for WebGL2 and WebGPU.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>
    <!-- CDN preconnect -->
    <link rel="preconnect" href="https://fonts.noisefactor.io" crossorigin>
    <link rel="preconnect" href="https://shaders.noisedeck.app" crossorigin>
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/nunito/Nunito-Block.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/noto-sans-mono/NotoSansMono-Block.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/victor-mono/VictorMono-Block.woff2" as="font" type="font/woff2" crossorigin>
    <script type="importmap">
        { "imports": { "handfish": "https://handfish.noisefactor.io/0/handfish.esm.min.js" } }
    </script>
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/tokens.css">
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/dialogs.css">
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0/styles/menus-and-toolbars.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
    <!-- Rotate Device Overlay (portrait mode) -->
    <div id="rotate-device-overlay">
        <div class="rotate-icon"><span class="material-symbols-outlined">screen_rotation</span></div>
        <p>Please rotate your device to landscape mode</p>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-modal">
            <div class="loading-brand">
                <svg class="loading-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="currentColor"><g transform="translate(0,600) scale(0.1,-0.1)"><path d="M883 4443 l677 -678 672 -2 671 -1 -679 679 -679 679 -670 0 -670 0 678 -677z"/><path d="M2308 4449 c370 -368 681 -673 692 -677 10 -4 315 -6 677 -4 l658 3 -680 674 -680 674 -670 0 -670 0 673 -670z"/><path d="M3753 4440 l682 -680 650 1 c358 0 656 3 663 8 8 5 -208 227 -662 679 l-675 672 -670 0 -669 0 681 -680z"/><path d="M1660 3673 c0 -4 305 -310 678 -680 l677 -672 670 0 670 -1 -681 680 -681 680 -667 0 c-366 0 -666 -3 -666 -7z"/><path d="M3765 3000 l680 -680 670 0 670 0 -680 680 -680 680 -670 0 -670 0 680 -680z"/><path d="M3780 1555 l675 -675 671 0 672 0 -676 675 -677 675 -670 0 -670 0 675 -675z"/></g></svg>
                <h1 class="loading-title"><span>Foundry</span></h1>
                <p class="loading-tagline">Shader Effects Editor</p>
                <div class="loading-status">
                    <div class="loading-spinner"></div>
                    <span>Initializing</span>
                </div>
            </div>
        </div>
    </div>

    <div id="app">
        <!-- Menu Bar: shared handfish component; config assigned in js/app.js -->
        <menu-bar id="menu" bar-label="Foundry menu"></menu-bar>

        <!-- Hidden elements for legacy compatibility -->
        <textarea id="dsl-editor" style="display:none" spellcheck="false"></textarea>
        <div id="compile-status" class="compile-status" style="display:none"></div>
        <div id="file-tree" style="display:none"></div>

        <!-- Center Panel: Canvas -->
        <div id="center-panel" class="panel" role="main">
            <div class="canvas-container">
                <canvas id="canvas" width="1024" height="1024" aria-label="Shader preview"></canvas>
                
                <!-- Control Buttons (top right) -->
                <div class="control-buttons" role="toolbar" aria-label="Controls">
                </div>
                
                <!-- Params Overlay (bottom left).
                     No overlay-header here: <effect-controls> brings its own
                     titlebar (namespace, effect name, help, close) and its own
                     scrolling body. -->
                <div id="params-overlay" class="canvas-overlay bottom-left" hidden>
                    <div id="params-overlay-content"></div>
                </div>
                
                <!-- Saved Effects Overlay (bottom left) -->
                <div id="saved-overlay" class="canvas-overlay bottom-left" hidden>
                    <div class="overlay-header">
                        <span class="overlay-title">Saved Effects</span>
                        <div class="overlay-actions">
                            <button id="save-effect-overlay-btn" class="action-btn small" title="Save current effect"><span class="icon-material">save</span></button>
                        </div>
                        <button class="overlay-close-btn" aria-label="Close">
                            <span class="icon-material">close</span>
                        </button>
                    </div>
                    <div id="saved-overlay-content" class="overlay-content" role="listbox" aria-label="Saved effects">
                        <div class="empty-state">No saved effects</div>
                    </div>
                </div>
                
                <!-- Canvas Code Editor (visible by default for Effect Workspace) -->
                <code-editor id="canvas-editor" line-numbers="true" placeholder="Enter DSL code here..."></code-editor>
                
                <!-- Compiler Error Display -->
                <div id="compiler-error"></div>
            </div>
        </div>
    </div>

    <!-- Doc Reader Panel -->
    <div id="doc-reader-panel">
        <div class="doc-reader-header">
            <h2 class="doc-reader-title">Documentation</h2>
            <button class="doc-reader-close" aria-label="Close documentation">×</button>
        </div>
        <div id="doc-reader-content"></div>
    </div>

    <script src="js/vendor/marked.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
